name: Quillora CI

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quillora-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Standard hosted runners are free for public repositories. Never silently
    # consume private-repository allowances; require a separate budget decision.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Run offline regression tests
        run: npm test
      - name: Check TypeScript
        run: npx tsc --noEmit --incremental false
      - name: Build production application
        run: npm run build
      - name: Smoke-test fail-closed production access
        shell: bash
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3019 > "$RUNNER_TEMP/quillora-production.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3019/api/health > /dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          node tests/production-access.mjs
